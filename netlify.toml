[build]
command = "npm install && npm install --prefix police-admin && VITE_API_URL=/ npm run admin:build"
publish = "police-admin/dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
